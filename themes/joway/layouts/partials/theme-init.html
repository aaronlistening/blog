<script>
(function () {
  var KEY = "theme";
  var LIGHT = "light", DARK = "dark", SYSTEM = "system";
  function systemTheme() {
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? DARK : LIGHT;
  }
  function stored() { return localStorage.getItem(KEY); }
  function current() {
    var s = stored();
    return s && s !== SYSTEM ? s : systemTheme();
  }
  function apply(theme) {
    if (theme === SYSTEM) theme = systemTheme();
    var root = document.documentElement;
    if (theme === DARK) root.setAttribute("data-theme", "dark");
    else root.removeAttribute("data-theme");
    updateIcon(theme);
  }
  function updateIcon(theme) {
    var btn = document.getElementById("theme-toggle");
    if (btn) btn.textContent = theme === DARK ? "\u2600\ufe0f" : "\ud83c\udf19";
  }
  function init() {
    var s = stored();
    if (s) apply(s === SYSTEM ? systemTheme() : s);
    else apply(SYSTEM);
  }
  function toggle() {
    var cur = stored() || SYSTEM;
    var next;
    if (cur === SYSTEM) next = systemTheme() === DARK ? LIGHT : DARK;
    else if (cur === DARK) next = LIGHT;
    else next = DARK;
    localStorage.setItem(KEY, next);
    apply(next);
  }
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
    var s = stored();
    if (!s || s === SYSTEM) apply(SYSTEM);
  });
  window.toggleTheme = toggle;
  init();
})();
</script>
